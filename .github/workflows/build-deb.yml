name: Deb

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: python3 -m unittest discover -s Tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            suffix: rootless
          - scheme: roothide
            suffix: roothide
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: true
    steps:
      - uses: actions/checkout@v6

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.theos
          key: roothide-theos-${{ runner.os }}-v1

      - name: Setup
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos -o "$RUNNER_TEMP/install-theos"
          # Ubuntu 26.04 renamed the libxml2 package to libxml2-16, so the installer's
          # apt line fails there. Nothing in Theos or its toolchain uses it, so drop it.
          sed -i '/apt install -y build-essential/s/ libxml2 / /' "$RUNNER_TEMP/install-theos"
          bash "$RUNNER_TEMP/install-theos"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          make clean
          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}" \
            DISABLE_ROOTLESS_COMPAT_WARNING=1

      - name: Name package
        id: name
        run: |
          deb="$(ls packages/*.deb | head -1)"
          version="$(awk '/^Version:/ {print $2}' control)"
          output="com.itzzace.ytkace_${version}_${{ matrix.suffix }}.deb"
          mkdir -p artifacts
          cp "$deb" "artifacts/$output"
          echo "deb=artifacts/$output" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-deb-${{ matrix.suffix }}
          path: ${{ steps.name.outputs.deb }}
          if-no-files-found: error
